<!--l. 21--><p class="noindent" ><span class="paragraphHead"><a

class="cmbx-10x-x-109">Description</span></span>
</p><!--l. 21--><p class="noindent" > <span class="obeylines-h"><span class="verb"><span 
class="cmtt-10x-x-109">X=sign(A)</span></span></span> returns the matrix made of the signs of <span class="obeylines-h"><span class="verb"><span 
class="cmtt-10x-x-109">A(i,j)</span></span></span>.For complex <span class="obeylines-h"><span class="verb"><span 
class="cmtt-10x-x-109">A</span></span></span>, <span class="obeylines-h"><span class="verb"><span 
class="cmtt-10x-x-109">sign(A)</span><span 
class="cmtt-10x-x-109">&#x00A0;=</span><span 
class="cmtt-10x-x-109">&#x00A0;A./abs(A)</span></span></span>.
function.
</p>
